      }
    }
  }
  // เรียกสร้างปุ่มเมนูอัตโนมัติทันทีที่โหลดสคริปต์
  setTimeout(ensureExpensesNavButton, 100);

  async function renderExpenses() {
    ensureExpensesNavButton();
    setActiveNav('expenses');
    await fetchExpenseDashboardData();
  }

  function setExpenseQuickDate(mode) {
    const now = new Date();
    const fmt = d => d.toISOString().slice(0, 10);
    if (mode === 'TODAY') {
      EXPENSE_STATE.startDate = fmt(now);
      EXPENSE_STATE.endDate = fmt(now);
    } else if (mode === 'YESTERDAY') {
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      EXPENSE_STATE.startDate = fmt(y);
      EXPENSE_STATE.endDate = fmt(y);
    } else if (mode === 'MONTH') {
      const m = new Date(now.getFullYear(), now.getMonth(), 1);
      EXPENSE_STATE.startDate = fmt(m);
      EXPENSE_STATE.endDate = fmt(now);
    }
    fetchExpenseDashboardData();
  }

  function onSelectExpenseMonth(ymStr) {
    if (!ymStr) return;
    EXPENSE_STATE.selectedMonth = ymStr;
    const parts = ymStr.split('-');
    if (parts.length === 2) {
      const yr = parseInt(parts[0], 10);
      const mo = parseInt(parts[1], 10);
      const lastDayObj = new Date(yr, mo, 0);
      EXPENSE_STATE.startDate = `${yr}-${String(mo).padStart(2, '0')}-01`;
      EXPENSE_STATE.endDate = `${yr}-${String(mo).padStart(2, '0')}-${String(lastDayObj.getDate()).padStart(2, '0')}`;
      fetchExpenseDashboardData();
    }
  }

  async function fetchExpenseDashboardData() {
    const sEl = document.getElementById('exp-start-date');
    const eEl = document.getElementById('exp-end-date');
    if (sEl) EXPENSE_STATE.startDate = sEl.value;
    if (eEl) EXPENSE_STATE.endDate = eEl.value;

    try {
      const res = await apiCall('getExpenseDashboard', {
        startDate: EXPENSE_STATE.startDate,
        endDate: EXPENSE_STATE.endDate
      });
      EXPENSE_STATE.data = res;
      drawExpenseDashboard();
    } catch (e) {}
  }

  function drawExpenseDashboard() {
    const view = document.getElementById('app-view');
    const d = EXPENSE_STATE.data;
    if (!d) return;

    const sum = d.summary || {};
    const isAdmin = (window.STATE.currentUser && window.STATE.currentUser.Role === 'ADMIN');
    const q = (EXPENSE_STATE.searchQuery || '').toLowerCase();

    // กรองรายการในตารางสมุดรายวันรายจ่าย/รายรับอื่น
    const allTx = d.expensesList || [];
    const filteredTx = allTx.filter(ex => {
      const matchCat = EXPENSE_STATE.filterCategory === 'ALL' || ex.Category === EXPENSE_STATE.filterCategory;
      const matchCh = EXPENSE_STATE.filterChannel === 'ALL' || String(ex.PayChannel || '').includes(EXPENSE_STATE.filterChannel);
      const matchQ = !q || String(ex.Title || '').toLowerCase().includes(q) || String(ex.Category || '').toLowerCase().includes(q) || String(ex.RefTarget || '').toLowerCase().includes(q);
      return matchCat && matchCh && matchQ;
    });

    let sumFilteredExp = 0, sumFilteredInc = 0;
    const txRows = filteredTx.map((ex, idx) => {
      const isCancelled = (ex.Status === 'Cancelled' || ex.Status === 'ยกเลิก');
      const isIncome = (ex.TxType === 'OTHER_INCOME');
      const amt = parseFloat(ex.Amount) || 0;
      if (!isCancelled) {
        if (isIncome) sumFilteredInc += amt;
        else sumFilteredExp += amt;
      }

      let chBadge = 'bg-slate-100 text-slate-700';
      if (String(ex.PayChannel).includes('ลิ้นชัก')) chBadge = 'bg-amber-100 text-amber-900 border border-amber-300';
      else if (String(ex.PayChannel).includes('โอน')) chBadge = 'bg-blue-100 text-blue-800 border border-blue-200';
      else if (String(ex.PayChannel).includes('เซฟ')) chBadge = 'bg-purple-100 text-purple-800 border border-purple-200';

      return `
        <tr class="border-b border-slate-100 text-xs hover:bg-slate-50 ${isCancelled ? 'opacity-40 line-through bg-rose-50/30' : ''}">
          <td class="py-2.5 px-2 text-center font-mono text-slate-400">${idx + 1}</td>
          <td class="py-2.5 px-3 font-mono text-slate-600">${String(ex.ExpDate).slice(0, 16)}<br><span class="text-[10px] text-slate-400">${ex.ExpID}</span></td>
          <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded-md font-bold text-[11px] ${isIncome ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${ex.Category}</span></td>
          <td class="py-2.5 px-3 font-extrabold text-slate-800">
            ${ex.Title}
            ${ex.RefTarget ? `<span class="ml-1 px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded text-[10px] font-bold">📌 ${ex.RefTarget}</span>` : ''}

async function cancelExpenseItem(expId) {
    const isFuelBill = String(expId || '').startsWith('FL-');
    const confirmMsg = isFuelBill
      ? `⚠️ รายการ ${expId} เป็น "บิลน้ำมันเชื้อเพลิง (tb_FuelLogs)"\nคุณต้องการลบบิลน้ำมันที่คีย์ผิด/คีย์ซ้ำนี้ออกจากระบบใช่หรือไม่?`
      : `⚠️ ยืนยันการยกเลิกรายการรายจ่าย ${expId} ใช่หรือไม่?`;

    if (!confirm(confirmMsg)) return;
    try {
      if (isFuelBill) {
        await apiCall('deleteFuelLog', { FuelID: expId });
        showToast('ลบบิลน้ำมันที่คีย์ซ้ำเรียบร้อยแล้วค่ะ!');
      } else {
        await apiCall('cancelExpense', { ExpID: expId });
        showToast('ยกเลิกรายการรายจ่ายเรียบร้อยแล้วค่ะ!');
      }
      fetchExpenseDashboardData();
    } catch (e) {}
  }

  async function deleteFuelLogById(fuelId) {
    if (!confirm(`⚠️ ยืนยันการลบบิลน้ำมัน ${fuelId} ออกจากระบบใช่หรือไม่?`)) return;
    try {
      await apiCall('deleteFuelLog', { FuelID: fuelId });
      showToast('ลบบิลน้ำมันเรียบร้อยแล้วค่ะ!');
      if (document.getElementById('nav-fleet')?.classList.contains('active-nav') && typeof fetchFleetDashboardData === 'function') {
        fetchFleetDashboardData();
      } else if (document.getElementById('nav-expenses')?.classList.contains('active-nav')) {
        fetchExpenseDashboardData();
      } else {
        renderSettlement();
      }
    } catch (e) {}
  }
    // ==========================================
  // 🚛 VIEW 12: SMART FLEET, FUEL, TAX & 7,000 KM OIL SERVICE MANAGEMENT
  // ==========================================
// ==========================================
  // 🚛 VIEW 12 (V5.4 UPGRADED): SMART FLEET, TRIP LOGBOOK, FUEL, TAX & 7,000 KM OIL SERVICE
  // ==========================================
  window.FLEET_STATE = {
    startDate: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10),
    endDate: new Date().toISOString().slice(0, 10),
    selectedMonth: new Date().toISOString().slice(0, 7),
    filterVehicle: 'ALL',
    activeTab: 'USAGE', // USAGE, TRIPS, FUEL, MAINT
    searchQuery: '',
    data: null
  };

  function ensureFleetNavButton() {
    if (!document.getElementById('nav-fleet')) {
      const targetBtn = document.getElementById('nav-settlement') || document.getElementById('nav-pos');
      if (targetBtn && targetBtn.parentNode) {
        const btn = document.createElement('button');
        btn.id = 'nav-fleet';
        btn.className = 'nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition';
        btn.onclick = () => navigate('fleet');
        btn.innerHTML = `<i data-lucide="wrench" class="w-5 h-5 text-amber-600"></i><span>รถขนส่ง & น้ำมัน/ภาษี/PM</span>`;
        targetBtn.parentNode.insertBefore(btn, targetBtn.nextSibling);
      }
    }
  }
  setTimeout(ensureFleetNavButton, 120);

  async function renderFleet() {
    ensureFleetNavButton();
    setActiveNav('fleet');
    await fetchFleetDashboardData();

  function setFleetQuickDate(mode) {
    const now = new Date();
    const fmt = d => d.toISOString().slice(0, 10);
    if (mode === 'TODAY') {
      FLEET_STATE.startDate = fmt(now);
      FLEET_STATE.endDate = fmt(now);
    } else if (mode === '7DAYS') {
      const w = new Date(now);
      w.setDate(now.getDate() - 6);
      FLEET_STATE.startDate = fmt(w);
      FLEET_STATE.endDate = fmt(now);
    } else if (mode === 'MONTH') {
      FLEET_STATE.startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
      FLEET_STATE.endDate = fmt(now);
    }
    fetchFleetDashboardData();
  }

  function onSelectFleetMonth(ymStr) {
    if (!ymStr) return;
    FLEET_STATE.selectedMonth = ymStr;
    const parts = ymStr.split('-');
    if (parts.length === 2) {
      const yr = parseInt(parts[0], 10);
      const mo = parseInt(parts[1], 10);
      const lastDay = new Date(yr, mo, 0).getDate();
      FLEET_STATE.startDate = `${yr}-${String(mo).padStart(2, '0')}-01`;
      FLEET_STATE.endDate = `${yr}-${String(mo).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
      fetchFleetDashboardData();
    }
  }

  async function fetchFleetDashboardData() {
    const sEl = document.getElementById('flt-start-date');
    const eEl = document.getElementById('flt-end-date');
    if (sEl) FLEET_STATE.startDate = sEl.value;
    if (eEl) FLEET_STATE.endDate = eEl.value;

    try {
      const res = await apiCall('getFleetDashboard', {
        startDate: FLEET_STATE.startDate,
        endDate: FLEET_STATE.endDate
      });
      FLEET_STATE.data = res;
      if (res.vehicles) STATE.route.vehicles = res.vehicles;
      if (res.employees) STATE.route.employees = res.employees;
      drawFleetDashboard();
    } catch (e) {}
  }

                <option value="90" ${cfg.RETENTION_DAYS === '90' ? 'selected' : ''}>เก็บ 90 วันล่าสุด (+เก็บทุกวันที่ 1 ถาวร)</option>
              </select>
            </div>
          </div>

          <!-- ตัวเลือกเสริม Telegram Bot -->
          <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-extrabold text-slate-600">💬 Telegram Bot Token (ตัวเลือกเสริมสำหรับส่งแชทมือถือ — เว้นว่างได้)</label>
              <input type="text" id="bkp-tg-token" value="${escStr(cfg.TELEGRAM_BOT_TOKEN || '')}" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-xl text-xs font-mono" placeholder="เช่น 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
            </div>
            <div>
              <label class="text-[11px] font-extrabold text-slate-600">💬 Telegram Chat ID (เว้นว่างได้)</label>
              <input type="text" id="bkp-tg-chatid" value="${escStr(cfg.TELEGRAM_CHAT_ID || '')}" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-xl text-xs font-mono" placeholder="เช่น -100123456789">
            </div>
          </div>

          <div class="flex justify-end pt-1">
            <button onclick="saveBackupConfiguration()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl font-extrabold text-xs shadow-md flex items-center gap-1.5 transition">
              <i data-lucide="save" class="w-4 h-4"></i> บันทึกการตั้งค่า & เปิดใช้งานตั้งเวลาอัตโนมัติ
            </button>
          </div>
        </div>

        <!-- ตารางประวัติการสำรองฐานข้อมูล -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="p-3.5 bg-slate-50 border-b flex justify-between items-center">
            <h3 class="font-extrabold text-sm text-slate-800 flex items-center gap-1.5">
              <i data-lucide="hard-drive" class="w-4 h-4 text-emerald-600"></i> ประวัติไฟล์สำรองฐานข้อมูลใน Google Drive (${logs.length} รอบล่าสุด)
            </h3>
            <button onclick="triggerManualBackupNow(false)" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-xl font-extrabold text-xs transition">
              + สำรองเฉพาะไฟล์เดี๋ยวนี้
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead class="bg-white border-b-2 border-slate-200 text-[10px] text-slate-500 font-extrabold uppercase">
                <tr>
                  <th class="py-2.5 px-2 text-center">#</th>
                  <th class="py-2.5 px-3">วันเวลาที่สำรอง / รหัส</th>
                  <th class="py-2.5 px-3">รูปแบบการทำงาน</th>
                  <th class="py-2.5 px-3">ชื่อไฟล์สำรองใน Google Drive</th>
                  <th class="py-2.5 px-2 text-center">ล้างไฟล์เก่า</th>
                  <th class="py-2.5 px-3">สถานะส่งรายงาน</th>
                  <th class="py-2.5 px-3 text-right">ลิงก์เปิดไฟล์</th>
                </tr>
              </thead>
              <tbody>${logRows}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
    lucide.createIcons();
  }

  async function saveBackupConfiguration() {
    const payload = {
      AUTO_ENABLED: document.getElementById('bkp-auto-enabled').value,
      TRIGGER_HOUR: document.getElementById('bkp-trigger-hour').value,
      ADMIN_EMAIL: document.getElementById('bkp-admin-email').value.trim(),
      RETENTION_DAYS: document.getElementById('bkp-retention-days').value,
      TELEGRAM_BOT_TOKEN: document.getElementById('bkp-tg-token').value.trim(),
      TELEGRAM_CHAT_ID: document.getElementById('bkp-tg-chatid').value.trim()
    };
    try {
      await apiCall('saveBackupSettings', payload);
      showToast('บันทึกการตั้งค่าและตั้งเวลาทำงานอัตโนมัติเรียบร้อยแล้วค่ะ!');
      renderBackupCenter();
    } catch (e) {}
  }

  async function triggerManualBackupNow(sendReport) {
    try {
      const res = await apiCall('runManualBackupNow', { sendReport: !!sendReport });
      showToast(`สำรองฐานข้อมูลสำเร็จ: ${res.backup.FileName}`);
      renderBackupCenter();
    } catch (e) {}
  }

  async function triggerExecutiveReportNow() {
    try {
      const res = await apiCall('sendExecutiveReportNow', {});
      showToast(`ส่งรายงานสรุปผู้บริหารเรียบร้อย: ${res.EmailStatus}`);
    } catch (e) {}
  }
    // ==========================================
  // 🔐 FACTORY LOGIN & SESSION CONTROLLER
  // ==========================================
  function appendFactoryPin(digit) {
    const inp = document.getElementById('factory-pin-input');
    if (inp && inp.value.length < 6) inp.value += digit;
  }

  function backspaceFactoryPin() {
    const inp = document.getElementById('factory-pin-input');
    if (inp) inp.value = inp.value.slice(0, -1);
  }

  function clearFactoryPin() {
    const inp = document.getElementById('factory-pin-input');
    if (inp) { inp.value = ''; inp.focus(); }
  }

  async function submitFactoryLogin() {
    const pin = document.getElementById('factory-pin-input')?.value.trim() || '';
    if (!pin) return showToast('กรุณากรอกรหัส PIN เข้าสู่ระบบ', 'error');
    try {
      const user = await apiCall('verifyFactoryLogin', { pin: pin });
      applyFactoryUserSession(user);
      sessionStorage.setItem('MAEJAI_FACTORY_USER', JSON.stringify(user));
      showToast(`ยินดีต้อนรับ ${user.EmpName} เข้าสู่ระบบค่ะ!`);
    } catch (e) {
      clearFactoryPin();
    }
  }

  function applyFactoryUserSession(user) {
    window.STATE.currentUser = user;
    document.getElementById('factory-login-screen')?.classList.add('hidden');
    if (document.getElementById('current-user-name')) {
      document.getElementById('current-user-name').innerText = user.EmpName;
    }
    if (document.getElementById('current-user-role')) {
      document.getElementById('current-user-role').innerText = `${user.Role === 'ADMIN' ? '👑 ผู้บริหาร' : '🏢 เสมียนหน้าลาน'} (${user.Position})`;
    }
    if (document.getElementById('mobile-user-badge')) {
      document.getElementById('mobile-user-badge').innerText = `👤 ${user.EmpName}`;
    }

    const empNavBtn = document.getElementById('nav-tb_Employees');
    if (empNavBtn) {
      empNavBtn.classList.toggle('hidden', user.Role !== 'ADMIN');
    }

    ensureReportsNavButton();
    lucide.createIcons();
    navigate(user.Role === 'ADMIN' ? 'dashboard' : 'pos');
  }

  function logoutFactory() {
    window.STATE.currentUser = null;
    sessionStorage.removeItem('MAEJAI_FACTORY_USER');
    if (document.getElementById('factory-pin-input')) {
      document.getElementById('factory-pin-input').value = '';
    }
    document.getElementById('factory-login-screen')?.classList.remove('hidden');
    lucide.createIcons();
  }

  window.onload = () => {
    ensureReportsNavButton();
    lucide.createIcons();
    const savedSession = sessionStorage.getItem('MAEJAI_FACTORY_USER');
    if (savedSession) {
      try {
        const user = JSON.parse(savedSession);
        if (user && user.EmpName) {
          applyFactoryUserSession(user);
          return;
        }
      } catch (e) {}
    }
  };
  async function goToDriverApp() {
    try {
      const baseUrl = await apiCall('getWebAppUrl');
      if (baseUrl) {
        window.top.location.href = baseUrl + '?page=driver';
        return;
      }
    } catch (e) {}
    window.top.location.href = window.location.origin + window.location.pathname + '?page=driver';
  }
  
</script>
