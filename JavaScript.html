<script>
  /**
   * ============================================================================
   * 🏢 MAE JAI SMART ERP - MASTER FRONTEND VIEWS & STATE (JavaScript.html)
   * Version: 4.9 (PART 1/2: Core State, Print Engine & Views 1-5)
   * ⚠️ หมายเหตุ: วางโค้ดส่วนที่ 1 นี้ก่อน แล้วนำส่วนที่ 2 มาวางต่อท้ายทันที
   * ============================================================================
   */

  // ==========================================
  // 🎨 1. CSS สำหรับการพิมพ์ (รองรับทั้งสลิป 80mm และรายงาน A4 ไม่ตกขอบ)
  // ==========================================
  const printStyle = document.createElement('style');
  printStyle.innerHTML = `
    @media print {
      html, body, main, #app-view, #print-area {
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        position: static !important;
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
      }
      aside, nav, header, .no-print, #factory-login-screen, #toast-container, #loading-overlay, #modal-backdrop {
        display: none !important;
      }
      body.print-slip #app-view, body.print-slip main { display: none !important; }
      body.print-slip #slip-container, body.print-slip #slip-container * { visibility: visible !important; }
      body.print-slip #slip-container {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 80mm !important;
        padding: 4mm !important;
        font-family: 'Prompt', sans-serif;
        color: #000 !important;
        background: #fff !important;
        font-size: 12px;
        z-index: 99999 !important;
      }
      body.print-report #slip-container { display: none !important; }
      body.print-report #print-area, body.print-report #print-area * {
        visibility: visible !important;
      }
      body.print-report #print-area div {
        max-height: none !important;
        overflow: visible !important;
      }
      body.print-report table {
        width: 100% !important;
        border-collapse: collapse !important;
        table-layout: auto !important;
        font-size: 9px !important;
      }
      body.print-report th, body.print-report td {
        padding: 3px 4px !important;
        white-space: normal !important;
        word-break: break-word !important;
        border-bottom: 1px solid #cbd5e1 !important;
      }
      body.print-report thead {
        display: table-header-group !important;
      }
      body.print-report tfoot {
        display: table-row-group !important;
        background-color: #0f172a !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.print-report tfoot td {
        color: #ffffff !important;
        font-weight: bold !important;
        padding: 5px 4px !important;
        white-space: nowrap !important;
      }
      body.print-report tfoot td.text-right, body.print-report tfoot td[style*="text-right"] {
        text-align: right !important;
        font-size: 11px !important;
        letter-spacing: -0.5px;
      }
      body.print-report tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .print-only { display: block !important; }
      @page { size: A4 portrait; margin: 6mm; }
    }
    .print-only { display: none; }
  `;
  document.head.appendChild(printStyle);

  // ==========================================
  // 🧠 2. GLOBAL APPLICATION STATE & API GATEWAY
  // ==========================================
  window.STATE = { 
    currentUser: null,
    pos: { products: [], customers: [], specialPrices: [], promoMap: {}, routes: [], stockMap: {}, todaySales: [], productSummary: [], cart: {}, selectedCustomer: '', autoPromoDiscount: 0 }, 
    route: { dispatches: [], fuelLogs: [], routes: [], vehicles: [], employees: [], products: [] }, 
    bucket: { allBuckets: [], customers: [], recentLogs: [] }, 
    credit: { summary: {}, debtList: [], customers: [], routes: [], recentPayments: [] }, 
    inventory: { summary: {}, balances: [], products: [], recentLogs: [] }, 
    customerDashboard: { list: [], routes: [], products: [] }, 
    bucketMaster: { list: [], customers: [], summary: { total:0, inStock:0, borrowed:0, maintenance:0 } }, 
    master: { tableName: '', list: [] } 
  };

  function apiCall(action, payload = {}) {
    showLoading(true);
    // 🛡️ ประทับตราชื่อพนักงานที่ล็อกอินอยู่ลงในทุกธุรกรรมอัตโนมัติ (Audit Trail)
    if (window.STATE && window.STATE.currentUser && typeof payload === 'object' && payload !== null) {
      if (!payload.CreatedBy || payload.CreatedBy === 'Admin' || payload.CreatedBy === 'POS') {
        payload.CreatedBy = `${window.STATE.currentUser.EmpName}`;
      }
    }
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(res => {
          showLoading(false);
          if (res && res.status === 'success') resolve(res.data);
          else { showToast(res ? res.message : 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์', 'error'); reject(res ? res.message : 'Error'); }
        }).withFailureHandler(err => {
          showLoading(false); showToast('Error: ' + err.message, 'error'); reject(err);
        }).processApiRequest({ action, payload });
      } else { showLoading(false); showToast('กรุณาใช้งานผ่านลิงก์ Web App', 'error'); reject('Not in GAS'); }
    });
  }

  function escStr(str) { return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  function showLoading(show) { const el = document.getElementById('loading-overlay'); if (el) el.classList.toggle('hidden', !show); }
  function showToast(msg, type = 'success') {
    const container = document.getElementById('toast-container'); if (!container) return;
    const t = document.createElement('div');
    t.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white px-4 py-3 rounded-xl shadow-lg font-medium text-sm z-50 transition-all`;
    t.innerText = msg; container.appendChild(t); setTimeout(() => t.remove(), 4000);
  }
  function closeModal() { const el = document.getElementById('modal-backdrop'); if (el) el.classList.add('hidden'); }
  function setActiveNav(id) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active-nav'));
    if (document.getElementById('nav-' + id)) document.getElementById('nav-' + id).classList.add('active-nav');
  }
  function handleMobileMenu(val) { val.startsWith('M:') ? navigateMaster(val.replace('M:', '')) : navigate(val); }
function navigate(page) {
    if (!window.STATE.currentUser) {
      document.getElementById('factory-login-screen')?.classList.remove('hidden');
      return;
    }
    setActiveNav(page);
    if (page === 'dashboard') renderDashboard(); if (page === 'pos') renderPOS(); if (page === 'settlement') renderSettlement();
    if (page === 'buckets') renderBuckets(); if (page === 'credit') renderCredit(); if (page === 'inventory') renderInventory();
    if (page === 'customers') renderCustomers(); if (page === 'bucket_master') renderBucketMaster();
    if (page === 'expenses') renderExpenses(); if (page === 'fleet') renderFleet();
    if (page === 'backup') renderBackupCenter(); if (page === 'reports') renderReports();
  }
      function ensureReportsNavButton() {
    if (!document.getElementById('nav-reports')) {
      const invBtn = document.getElementById('nav-inventory') || document.getElementById('nav-credit');
      if (invBtn && invBtn.parentNode) {
        const btn = document.createElement('button'); btn.id = 'nav-reports'; btn.className = 'nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition'; btn.onclick = () => navigate('reports'); btn.innerHTML = `<i data-lucide="bar-chart-3" class="w-5 h-5 text-purple-600"></i><span>รายงานธุรกิจย้อนหลัง</span>`; invBtn.parentNode.insertBefore(btn, invBtn.nextSibling);
      }
    }
  }

  // 🛡️ สร้างหรือดึงกล่อง #slip-container ที่วางติดกับ document.body โดยตรง (ป้องกันใบเสร็จว่างเปล่า 100%)
  function getBodySlipContainer() {
    let slipDiv = document.getElementById('slip-container');
    if (!slipDiv || slipDiv.parentElement !== document.body) {
      if (slipDiv) slipDiv.remove();
      slipDiv = document.createElement('div');
      slipDiv.id = 'slip-container';
      slipDiv.className = 'hidden';
      document.body.appendChild(slipDiv);
    }
    return slipDiv;
  }

  function parseIceBreakdownFromSales(salesList) {
    const counts = { bigTube: 0, crushed: 0, smallTube: 0, block: 0, retail: 0, other: 0 };
    let totalStockUnits = 0;
    (salesList || []).forEach(s => {
      if (s.PaymentStatus === 'Cancelled' || s.PaymentStatus === 'ยกเลิก') return;
      const summary = String(s.ItemSummary || ''); if (!summary || summary === '-') return;
      summary.split(',').forEach(part => {
        const p = part.trim(); if (!p || p.includes('ส่วนลด') || p.includes('โปร') || p.includes('ค่ากระสอบ') || p.includes('ชาร์จเพิ่ม') || p.includes('ยอดหนี้คงค้าง')) return;
        const match = p.match(/x\s*(-?\d+(\.\d+)?)$/i); const qty = match ? parseFloat(match[1]) : 1; if (qty <= 0) return;
        if (p.includes('ขายปลีก')) { counts.retail += qty; } else if (p.includes('หลอดใหญ่')) { counts.bigTube += qty; totalStockUnits += qty; } else if (p.includes('บด')) { counts.crushed += qty; totalStockUnits += qty; } else if (p.includes('หลอดเล็ก')) { counts.smallTube += qty; totalStockUnits += qty; } else if (p.includes('ก้อน') || p.includes('ซอง')) { counts.block += qty; totalStockUnits += qty; } else { counts.other += qty; totalStockUnits += qty; }
      });
    });
    const badges = [`หลอดใหญ่: <b class="text-white">${counts.bigTube.toLocaleString()}</b>`, `บด: <b class="text-white">${counts.crushed.toLocaleString()}</b>`, `หลอดเล็ก: <b class="text-white">${counts.smallTube.toLocaleString()}</b>`, `ก้อน: <b class="text-white">${counts.block.toLocaleString()}</b>`];
    if (counts.retail > 0) badges.push(`ขายปลีก: <b class="text-purple-300">${counts.retail.toLocaleString()}</b>`); if (counts.other > 0) badges.push(`อื่นๆ: <b class="text-white">${counts.other.toLocaleString()}</b>`);
    return { counts, totalStockUnits, inlineHTML: badges.join(' <span class="text-slate-500 mx-1">|</span> '), plainText: `หลอดใหญ่ ${counts.bigTube} | บด ${counts.crushed} | หลอดเล็ก ${counts.smallTube} | ก้อน ${counts.block}${counts.retail > 0 ? ' | ขายปลีก ' + counts.retail : ''}` };
  }
// ==========================================
  // 📊 VIEW 1: EXECUTIVE DASHBOARD (V5.4 Complete Command Center)
  // ==========================================
  window.DASHBOARD_DATA = null;
  window.DASHBOARD_TARGET_DATE = '';

  async function renderDashboard(customDate) {
    if (customDate !== undefined) window.DASHBOARD_TARGET_DATE = customDate;
    try {
      const d = await apiCall('getDashboardData', { targetDate: window.DASHBOARD_TARGET_DATE || '' });
      window.DASHBOARD_DATA = d;
      if (d && d.targetDate) window.DASHBOARD_TARGET_DATE = d.targetDate;
      drawDashboardView('ALL');
    } catch (e) {}
  }

  function shiftDashboardDate(deltaDays) {
    const curStr = window.DASHBOARD_TARGET_DATE || new Date().toISOString().slice(0, 10);
    const dt = new Date(curStr + 'T12:00:00');
    dt.setDate(dt.getDate() + deltaDays);
    renderDashboard(dt.toISOString().slice(0, 10));
  }

  function drawDashboardView(selectedRouteKey = 'ALL') {
    const view = document.getElementById('app-view');
    const d = window.DASHBOARD_DATA || {};
    const routes = d.routeBreakdown || [];
    const allSales = d.recentSales || [];
    const allPayments = d.todayPayments || [];
    const flags = d.auditFlags || {};
    const coldStocks = d.coldRoomStocks || d.coldRoomStock || [];
    const isAdmin = (window.STATE.currentUser && window.STATE.currentUser.Role === 'ADMIN');

    // 🧊 การ์ดสต๊อกน้ำแข็งในห้องเย็นพร้อมขายขณะนี้
    const coldStockPills = coldStocks.map(st => `
      <div onclick="navigate('inventory')" class="bg-white p-2.5 rounded-xl border border-blue-200 flex items-center justify-between gap-2 cursor-pointer hover:border-blue-400 shadow-2xs transition">
        <div class="min-w-0">
          <p class="text-xs font-extrabold text-slate-800 truncate">🧊 ${st.ProductName}</p>
          <p class="text-[10px] text-emerald-700 font-bold">${st.TodayProduced > 0 ? `ผลิตวันนี้ +${st.TodayProduced}` : 'พร้อมจ่ายห้องเย็น'}</p>
        </div>
        <div class="text-right shrink-0">
          <span class="text-base font-black ${st.Balance <= 10 ? 'text-rose-600' : 'text-blue-700'} block leading-none">${Number(st.Balance || 0).toLocaleString()}</span>
          <span class="text-[9px] text-slate-400">${st.Unit}</span>
        </div>
      </div>
    `).join('');

    const filteredSales = selectedRouteKey === 'ALL' ? allSales : allSales.filter(s => String(s.RouteID || 'หน้าลาน') === selectedRouteKey || String(s.RouteName || '').includes(selectedRouteKey));
    const filteredPayments = selectedRouteKey === 'ALL' ? allPayments : allPayments.filter(p => String(p.RouteKey || 'หน้าลาน') === selectedRouteKey);

    let sumDistKm = 0;
    let sumLoadedAll = 0;
    const routeRows = routes.map(r => {
      const fuelTotal = parseFloat(r.fuelCost) || 0;
      const fuelCash = r.fuelCashCost !== undefined ? (parseFloat(r.fuelCashCost) || 0) : fuelTotal;
      const othCashExp = parseFloat(r.otherCashExp) || 0;
      const totalCashOutRoute = fuelCash + othCashExp;
      const distKm = parseFloat(r.mileageDist) || 0;
      const loadedQ = parseFloat(r.loadedQty) || 0;
      const soldQ = parseFloat(r.totalQty) || 0;
      sumDistKm += distKm;
      sumLoadedAll += loadedQ;

      // เงินสดสุทธิส่งของแต่ละสาย = ขายสด + เก็บหนี้(เฉพาะเงินสด) - น้ำมันจ่ายสด - จ่ายสดลิ้นชักหน้าลาน
      const netCashRoute = (r.cashSales || 0) + (r.debtCollectedCash || 0) - totalCashOutRoute;

      let statusPill = '';
      if (r.RouteKey === 'หน้าลาน') {
        statusPill = `<span class="ml-1.5 px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">ลิ้นชักเสมียน</span>`;
      } else if (r.shiftStatus === 'ACTIVE') {
        const remOnTruck = Math.max(0, loadedQ - soldQ);
        statusPill = `<span class="ml-1.5 px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 text-[10px] font-extrabold animate-pulse">🟣 กำลังวิ่ง (${r.driverName} | เหลือบนรถ ${remOnTruck})</span>`;
      } else if (r.shiftStatus === 'CLOSED') {
        const hasIssue = (r.lossQty > 0 || r.cashDiff < 0);
        statusPill = `<span class="ml-1.5 px-2 py-0.5 rounded-md ${hasIssue ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'} text-[10px] font-extrabold">✅ ปิดกะแล้ว (${r.driverName}) ${r.lossQty > 0 ? `| หาย ${r.lossQty}` : ''} ${r.cashDiff < 0 ? `| ขาด ฿${Math.abs(r.cashDiff)}` : ''}</span>`;
      } else {
        statusPill = `<span class="ml-1.5 px-2 py-0.5 rounded-md bg-slate-100 text-slate-400 text-[10px] font-bold">ยังไม่ปล่อยรถ</span>`;
      }

      // แยกแสดงยอดเก็บหนี้ สด vs โอน ให้ชัดเจน 100% (ไม่สับสนเวลาบวกเลขตามบรรทัด!)
      const debtSubText = r.debtCollectedTotal > 0
        ? `<div class="text-[10px] font-extrabold mt-0.5"><span class="text-emerald-700">สด +฿${Number(r.debtCollectedCash || 0).toLocaleString()}</span> <span class="text-slate-300">|</span> <span class="text-blue-600">โอน ฿${Number(r.debtCollectedTransfer || 0).toLocaleString()}</span></div>`
        : '';

      const expSubText = othCashExp > 0
        ? `<div class="text-[10px] font-bold text-rose-500">จ่ายลิ้นชัก -฿${othCashExp.toLocaleString()}</div>`
        : (fuelTotal > fuelCash ? `<div class="text-[10px] font-normal text-slate-400">(บิลปั๊ม ฿${(fuelTotal - fuelCash).toLocaleString()})</div>` : '');

      const qtyDisplay = r.RouteKey === 'หน้าลาน'
        ? `<span class="font-extrabold text-blue-700">${soldQ.toLocaleString()}</span>`
        : `<span class="font-extrabold text-blue-700">${soldQ.toLocaleString()}</span> ${loadedQ > 0 ? `<span class="text-[10px] text-slate-400 block">เบิก ${loadedQ.toLocaleString()}</span>` : ''}`;

      return `
        <tr class="border-b border-slate-100 text-xs hover:bg-blue-50/40 transition">
          <td class="py-2.5 px-3 font-extrabold text-slate-800">${r.RouteName} ${statusPill}</td>
          <td class="py-2.5 px-2 text-center font-semibold text-slate-600">${r.billCount}</td>
          <td class="py-2.5 px-2 text-center">${qtyDisplay}</td>
          <td class="py-2.5 px-2 text-right font-semibold text-emerald-700">฿${Number(r.cashSales || 0).toLocaleString()}</td>
          <td class="py-2.5 px-2 text-right font-semibold text-blue-600">฿${Number(r.transferSales || 0).toLocaleString()}</td>
          <td class="py-2.5 px-2 text-right font-semibold text-amber-600">฿${Number(r.creditSales || 0).toLocaleString()}</td>
          <td class="py-2.5 px-2 text-right font-extrabold text-slate-900 bg-slate-50">฿${Number(r.totalSales || 0).toLocaleString()}</td>
          <td class="py-2.5 px-2 text-right font-bold text-purple-700 bg-purple-50/40">฿${Number(r.debtCollectedTotal || 0).toLocaleString()}${debtSubText}</td>
          <td class="py-2.5 px-2 text-right font-bold text-rose-600 bg-rose-50/30">${totalCashOutRoute > 0 ? '-฿' + totalCashOutRoute.toLocaleString() : '฿0'}${expSubText}</td>
          <td class="py-2.5 px-2 text-center font-bold text-indigo-700">${distKm > 0 ? distKm.toLocaleString() + ' กม.' : '-'}</td>
          <td class="py-2.5 px-3 text-right font-black text-emerald-700 bg-emerald-50/60 text-sm">฿${Number(netCashRoute).toLocaleString()}</td>
        </tr>
      `;
    }).join('') || '<tr><td colspan="11" class="text-center py-6 text-slate-400">ยังไม่มีข้อมูลสายส่งในวันนี้</td></tr>';

    const paymentRows = filteredPayments.map(p => {
      const isTrf = String(p.PaymentMethod || '').includes('โอน');
      return `<tr class="border-b border-slate-100 text-xs hover:bg-slate-50"><td class="py-2 px-3 font-mono text-slate-500">${String(p.PaymentDate || '').slice(11, 16)} น. <span class="text-[10px] text-slate-400">(${p.PaymentID})</span></td><td class="py-2 px-3 font-bold text-slate-800">${p.CustomerName}</td><td class="py-2 px-3 text-slate-600">${p.RouteName || '-'}</td><td class="py-2 px-3 text-slate-500">${p.RefSaleIDs}</td><td class="py-2 px-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${isTrf ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}">${p.PaymentMethod}</span></td><td class="py-2 px-3 text-slate-600 text-[11px]">${p.CreatedBy || 'Admin'}</td><td class="py-2 px-3 text-right font-extrabold text-purple-700">฿${Number(p.AmountPaid || 0).toLocaleString()}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="text-center py-5 text-slate-400 text-xs">วันนี้ยังไม่มีรายการรับชำระหนี้ค้าง</td></tr>';

    let sumFilteredAmt = 0;
    const saleRows = filteredSales.map((s, idx) => {
      const amt = parseFloat(s.TotalAmount) || 0; const payType = s.PaymentType || 'เงินสด'; const isCancelled = s.PaymentStatus === 'Cancelled' || s.PaymentStatus === 'ยกเลิก';
      if (!isCancelled) sumFilteredAmt += amt;
      let badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
      if (String(payType).includes('โอน')) badgeClass = 'bg-blue-50 text-blue-700 border-blue-200';
      if (String(payType).includes('เครดิต') || String(payType).includes('บิลเชื่อ') || String(payType).includes('ค้างชำระ')) badgeClass = 'bg-amber-50 text-amber-800 border-amber-200';
      return `<tr class="border-b border-slate-100 text-xs hover:bg-slate-50 ${isCancelled ? 'opacity-40 line-through bg-rose-50/30' : ''}"><td class="py-2 px-2 text-center text-slate-400 font-mono">${idx + 1}</td><td class="py-2 px-3 font-mono text-blue-600 font-semibold">${String(s.SaleDate || '').slice(11, 16)} <span class="text-[10px] text-slate-400">(${s.SaleID})</span></td><td class="py-2 px-3 font-bold text-slate-800">${s.CustomerName || 'ขาจร'}</td><td class="py-2 px-3 text-slate-600">${s.RouteName || s.RouteID || 'หน้าลาน'}</td><td class="py-2 px-3 text-slate-700">${s.ItemSummary || '-'}</td><td class="py-2 px-2 text-center"><span class="border px-2 py-0.5 rounded-md text-[10px] font-bold ${badgeClass}">${isCancelled ? 'ยกเลิก' : payType}</span></td><td class="py-2 px-3 text-right font-extrabold text-slate-900">฿${amt.toLocaleString()}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="text-center py-8 text-slate-400 text-xs">ยังไม่มีรายการบิลขายในหมวดนี้</td></tr>';

    const skuBreakdown = parseIceBreakdownFromSales(filteredSales);
    const routeFilterOpts = routes.map(r => `<option value="${r.RouteKey}" ${selectedRouteKey === r.RouteKey ? 'selected' : ''}>${r.RouteName}</option>`).join('');

    const totalCashOutAll = (parseFloat(d.totalCashFuelExpense) || 0) + (parseFloat(d.todayDrawerCashExpense) || 0);
    const hasRedFlags = (flags.cancelledBillsCount > 0 || flags.totalLossIceToday > 0 || flags.totalCashDiffToday < 0);

    const redFlagBanner = hasRedFlags ? `
      <div class="bg-rose-50 border-2 border-rose-300 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2 text-xs no-print">

  async function renderPOS() {
    const view = document.getElementById('app-view');
    try {
      const d = await apiCall('getInitialPOSData');
      STATE.pos = { ...STATE.pos, products: d.products||[], customers: d.customers||[], specialPrices: d.specialPrices||[], promoMap: d.promoMap||{}, routes: d.routes||[], stockMap: d.stockMap||{}, todaySales: d.todaySales||[], productSummary: d.productSummary||[], cart: {}, selectedCustomer: '', autoPromoDiscount: 0 };
      
      const custDatalist = STATE.pos.customers.map(c => `<option value="${c.CustomerID} : ${c.CustomerName}">`).join('');
      const rOpts = STATE.pos.routes.map(r => `<option value="${r.RouteID}">คีย์แทน: ${r.RouteName}</option>`).join('');

      const factorySalesOnly = (STATE.pos.todaySales || []).filter(s => {
        const rId = String(s.RouteID || '').trim();
        return (rId === '' || rId === 'หน้าลาน' || rId === 'หน้าร้าน' || rId === 'หน้าโรง' || rId === 'หน้าโรงงาน' || rId === 'WALK-IN');
      });

      let sumToday = 0, sumCash = 0, sumTransfer = 0, sumCredit = 0;

      const todayRows = factorySalesOnly.map((s, idx) => {
        const amt = parseFloat(s.TotalAmount) || 0; const payType = s.PaymentType || 'เงินสด'; const isCancelled = s.PaymentStatus === 'Cancelled' || s.PaymentStatus === 'ยกเลิก'; const isPaid = s.PaymentStatus === 'Paid' || s.PaymentStatus === 'ชำระแล้ว';
        if (!isCancelled) {
          sumToday += amt;
          if (String(payType).includes('เครดิต') || String(payType).includes('บิลเชื่อ') || String(payType).includes('ค้างชำระ')) sumCredit += amt;
          else if (String(payType).includes('โอน')) sumTransfer += amt; else sumCash += amt;
        }

        let displayPayType = payType; let pColor = 'text-slate-600';
        if (isCancelled) { displayPayType = '❌ ยกเลิกแล้ว'; pColor = 'text-rose-500 line-through'; }
        else if (String(payType).includes('เครดิต') || String(payType).includes('บิลเชื่อ') || String(payType).includes('ค้างชำระ')) { displayPayType = isPaid ? '💳 เครดิต (ชำระแล้ว)' : '💳 เครดิต (ค้างชำระ)'; pColor = isPaid ? 'text-emerald-600' : 'text-amber-600'; }

  function toggleCashBox() {
    const payType = document.getElementById('pos-pay')?.value; const box = document.getElementById('cash-calc-box'); if (!box) return;
    box.style.display = payType === 'เงินสด' ? 'block' : 'none';
    if (payType !== 'เงินสด') { if (document.getElementById('pos-cash-in')) document.getElementById('pos-cash-in').value = ''; if (document.getElementById('pos-change')) document.getElementById('pos-change').innerText = '฿0'; }
  }

  function calcGrandTotal() {
    const items = Object.values(STATE.pos.cart);
    let subTotal = 0;
    let eligibleUnitPrices = [];

    const promoMap = STATE.pos.promoMap || {};
    const custPromo = STATE.pos.selectedCustomer ? promoMap[STATE.pos.selectedCustomer] : null;
    const eligStr = custPromo ? String(custPromo.EligibleProducts || 'ALL') : '';
    const eligSet = (eligStr && eligStr !== 'ALL') ? new Set(eligStr.split(',')) : null;

    items.forEach(i => {
      subTotal += i.Quantity * i.UnitPrice;
      if (custPromo && (!eligSet || eligSet.has(String(i.ProductID)))) {
        for (let j = 0; j < i.Quantity; j++) eligibleUnitPrices.push(i.UnitPrice);
      }
    });

    let autoDiscount = 0;
    if (custPromo && eligibleUnitPrices.length >= 3) {
      eligibleUnitPrices.sort((a, b) => b - a);
      const bundleCount = Math.floor(eligibleUnitPrices.length / 3);
      let normalPriceOfBundledItems = 0;
      for (let j = 0; j < bundleCount * 3; j++) normalPriceOfBundledItems += eligibleUnitPrices[j];
      if (normalPriceOfBundledItems > bundleCount * 100) autoDiscount = normalPriceOfBundledItems - (bundleCount * 100);
    }
    STATE.pos.autoPromoDiscount = autoDiscount;

    const promoBadge = document.getElementById('pos-promo-badge');
    if (promoBadge) {
      if (autoDiscount > 0) {
        promoBadge.innerHTML = `🎁 ส่วนลดโปร 3 ชิ้น 100: <span class="text-rose-600 font-black">-฿${autoDiscount.toLocaleString()}</span>`;
        promoBadge.classList.remove('hidden');
      } else {
        promoBadge.classList.add('hidden');
      }
    }
    
    const fee = parseFloat(document.getElementById('pos-fee')?.value) || 0;
    const discount = parseFloat(document.getElementById('pos-discount')?.value) || 0;
    const grandTotal = subTotal + fee - discount - autoDiscount;

    const totEl = document.getElementById('pos-tot');
    if (totEl) { totEl.innerText = '฿' + grandTotal.toLocaleString(); totEl.setAttribute('data-total', grandTotal); }
    
    const cashIn = parseFloat(document.getElementById('pos-cash-in')?.value) || 0;
    const change = cashIn - grandTotal;
    const changeEl = document.getElementById('pos-change');
    if (!changeEl) return;
    
    if (cashIn === 0) { changeEl.innerText = '฿0'; changeEl.className = 'font-bold text-slate-400'; } 
    else if (change < 0) { changeEl.innerText = 'ขาด ฿' + Math.abs(change).toLocaleString(); changeEl.className = 'font-bold text-rose-600'; } 
    else { changeEl.innerText = '฿' + change.toLocaleString(); changeEl.className = 'font-bold text-emerald-600 text-lg'; }
  }

  function clearPosCart() { 
    STATE.pos.cart = {}; 
    if (document.getElementById('pos-cash-in')) document.getElementById('pos-cash-in').value = ''; 
    if (document.getElementById('pos-fee')) document.getElementById('pos-fee').value = ''; 
    if (document.getElementById('pos-discount')) document.getElementById('pos-discount').value = ''; 
    renderPosProducts(); renderPosCart(); 
  }

  function onPosCustDatalist(value) {
    if (!value) {
      STATE.pos.selectedCustomer = '';
      if (document.getElementById('pos-cust-name-badge')) document.getElementById('pos-cust-name-badge').innerText = 'ลูกค้า: ขาจรทั่วไป (ราคาหน้าลาน)';
      if (document.getElementById('pos-route')) document.getElementById('pos-route').value = 'หน้าลาน';
    } else {
      const parts = value.split(' : '); const id = parts[0].trim(); STATE.pos.selectedCustomer = id;
      const c = STATE.pos.customers.find(x => x.CustomerID === id);
      if (c) {
        if (document.getElementById('pos-cust-name-badge')) document.getElementById('pos-cust-name-badge').innerText = `ลูกค้า: ${c.CustomerName} (ซื้อหน้าโรงงาน)`;
        if (document.getElementById('pos-route')) document.getElementById('pos-route').value = 'หน้าลาน';
      }
    }
    Object.keys(STATE.pos.cart).forEach(pid => { const p = STATE.pos.products.find(x => x.ProductID === pid); if (p) STATE.pos.cart[pid].UnitPrice = getPrice(p); }); 
    renderPosProducts(); renderPosCart(); 
  }

function getPrice(p) { 
    if (STATE.pos.selectedCustomer) {
      const sp = STATE.pos.specialPrices.find(s => s.CustomerID === STATE.pos.selectedCustomer && s.ProductID === p.ProductID);
      if (sp) return parseFloat(sp.SpecialPrice);
      const custPromo = (STATE.pos.promoMap || {})[STATE.pos.selectedCustomer];
      if (custPromo) {
        const eligStr = String(custPromo.EligibleProducts || 'ALL');
        if (eligStr === 'ALL' || eligStr.split(',').map(x => x.trim()).includes(String(p.ProductID))) {
          return Math.max(35, parseFloat(p.DefaultPrice) || 0);
        }
      }
    } 
    return parseFloat(p.DefaultPrice) || 0; 
  }
  function renderPosProducts() { 
    const grid = document.getElementById('pos-grid'); if (!grid) return;
    const allPosItems = [...STATE.pos.products, ...RETAIL_QUICK_ITEMS];
    grid.innerHTML = allPosItems.map(p => { 
      const isRetail = !!p.isRetail; const pr = isRetail ? parseFloat(p.DefaultPrice) : getPrice(p); const q = STATE.pos.cart[p.ProductID]?.Quantity || 0; const stock = STATE.pos.stockMap[p.ProductID] || 0;
      const topBadge = isRetail ? `<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[9px] font-bold">ไม่หักสต๊อก</span>` : (stock <= 10 ? `<span class="bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded text-[9px] font-bold">เหลือ ${stock}</span>` : `<span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded text-[9px] font-bold">เหลือ ${stock}</span>`);
      return `<div onclick="adjCart('${p.ProductID}', 1)" class="relative bg-white p-3 md:p-4 rounded-xl border-2 transition-all cursor-pointer select-none active:scale-95 flex flex-col justify-between min-h-[115px] ${q > 0 ? 'border-blue-500 bg-blue-50 shadow-md' : 'border-slate-100 hover:border-blue-300 shadow-sm'}"><div><div class="text-[9px] md:text-[10px] text-slate-400 font-mono flex justify-between"><span>${p.ProductID}</span>${topBadge}</div><div class="font-bold text-slate-800 text-sm md:text-base leading-tight mt-1 line-clamp-2">${p.ProductName}</div></div><div class="font-black text-blue-600 text-lg flex items-center justify-between mt-2"><span>฿${pr}</span>${q > 0 ? `<span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg text-xs shadow-sm">x${q}</span>` : ''}</div></div>`; 
    }).join(''); 
  }

  function adjCart(id, d) { 
    const retailItem = RETAIL_QUICK_ITEMS.find(x => x.ProductID === id); const p = retailItem || STATE.pos.products.find(x => x.ProductID === id); if (!p) return; 
    if (!retailItem) { const currentStock = STATE.pos.stockMap[id] || 0; const currentCartQty = STATE.pos.cart[id] ? STATE.pos.cart[id].Quantity : 0; if (d > 0 && (currentCartQty + d) > currentStock) showToast(`ระวัง! สต๊อกเหลือเพียง ${currentStock} ${p.Unit}`, 'error'); }
    const unitPrice = retailItem ? parseFloat(retailItem.DefaultPrice) : getPrice(p);
    if (!STATE.pos.cart[id]) STATE.pos.cart[id] = { ProductID: id, ProductName: p.ProductName, UnitPrice: unitPrice, Quantity: 0, Unit: p.Unit || 'รายการ' }; 
    STATE.pos.cart[id].Quantity += d; if (STATE.pos.cart[id].Quantity <= 0) delete STATE.pos.cart[id]; 
    renderPosProducts(); renderPosCart(); 
  }

  function renderPosCart() { 
    const cartEl = document.getElementById('pos-cart'); if (!cartEl) return; const items = Object.values(STATE.pos.cart);

    const fee = parseFloat(document.getElementById('pos-fee').value) || 0;
    const discount = parseFloat(document.getElementById('pos-discount').value) || 0;
    const autoDiscount = STATE.pos.autoPromoDiscount || 0;

    const finalItems = [...cartItems];

  function calcDaysDiff(dateStr) {
    if (!dateStr) return 0;
    const d = new Date(String(dateStr).replace(' ', 'T'));
    if (isNaN(d.getTime())) return 0;
    return Math.max(0, Math.floor((new Date() - d) / (1000 * 60 * 60 * 24)));
  }

  function drawBucketsDashboard() {
    const view = document.getElementById('app-view');
    const d = STATE.bucket || {};
    const allBuckets = d.allBuckets || [];
    const routes = d.routes || [];
    const recentLogs = d.recentLogs || [];

    const inStockList = allBuckets.filter(b => b.CurrentStatus === 'ในคลัง');
    const maintList = allBuckets.filter(b => b.CurrentStatus === 'ส่งซ่อม');
    const borrowedList = allBuckets.filter(b => b.CurrentStatus === 'ถูกยืม');

    const shopGroups = {};
    const eventGroups = {};
    let shopBucketCount = 0;
    let eventBucketCount = 0;
    let deadOrOverdueHolderCount = 0;
    let deadOrOverdueBucketCount = 0;

    borrowedList.forEach(b => {
      const holder = String(b.CurrentLocation || 'ไม่ระบุชื่อ').trim();
      const activeLoanType = b.LoanType || b.BucketType || 'ถังยืมร้าน';
      if (activeLoanType === 'ถังยืมงาน') {
        if (!eventGroups[holder]) eventGroups[holder] = [];
        eventGroups[holder].push(b);
        eventBucketCount++;
      } else {
        if (!shopGroups[holder]) shopGroups[holder] = [];
        shopGroups[holder].push(b);
        shopBucketCount++;
      }
    });

    // วิเคราะห์ความเสี่ยงของผู้ถือถังแต่ละราย (ร้านประจำไม่ซื้อน้ำแข็ง >= 7 วัน หรือ งานนอกค้าง >= 3 วัน)
    function evaluateHolderRisk_(list, isEvent) {
      const first = list[0] || {};
      const maxBorrowDays = Math.max(...list.map(b => (b.BorrowDays !== undefined ? b.BorrowDays : calcDaysDiff(b.BorrowDate))));
      const daysSinceSale = first.DaysSinceLastSale;
      const qty30d = first.Last30DaysQty || 0;

      let isRisk = false;
      let riskBadge = '';

      if (isEvent) {
        if (maxBorrowDays >= 3) {
          isRisk = true;
          riskBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-600 text-white animate-pulse">🚨 งานนอกค้าง ${maxBorrowDays} วัน! (ตามเก็บด่วน)</span>`;
        } else {
          riskBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">⏱️ ยืมไป ${maxBorrowDays} วัน</span>`;
        }
      } else {
        if (daysSinceSale === null || daysSinceSale >= 7) {
          isRisk = true;
          const subTxt = daysSinceSale === null ? 'ไม่มีประวัติซื้อน้ำแข็ง' : `ไม่ซื้อน้ำแข็ง ${daysSinceSale} วัน!`;
          riskBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-600 text-white animate-pulse">🚨 ถังจม (${subTxt})</span>`;
        } else if (daysSinceSale >= 3) {
          isRisk = true;
          riskBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 text-amber-900 border border-amber-400">⚠️ ไม่ลงน้ำแข็ง ${daysSinceSale} วัน (30 วันซื้อ ${qty30d} ถุง)</span>`;
        } else {
          riskBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">🟢 ซื้อปกติ (30 วันรวม ${qty30d} ถุง)</span>`;
        }
      }
      return { isRisk, riskBadge, maxBorrowDays, routeId: first.HolderRouteID || '', routeName: first.HolderRouteName || 'หน้าลาน', phone: first.HolderPhone || '', note: first.Note || '' };
    }

    Object.keys(shopGroups).forEach(h => {
      const ev = evaluateHolderRisk_(shopGroups[h], false);
      if (ev.isRisk) { deadOrOverdueHolderCount++; deadOrOverdueBucketCount += shopGroups[h].length; }
    });
    Object.keys(eventGroups).forEach(h => {
      const ev = evaluateHolderRisk_(eventGroups[h], true);
      if (ev.isRisk) { deadOrOverdueHolderCount++; deadOrOverdueBucketCount += eventGroups[h].length; }
    });

            <p class="text-[11px] font-extrabold text-rose-800">🚨 ถังจม / เกินกำหนดคืน</p>
            <p class="text-2xl font-black ${deadOrOverdueBucketCount > 0 ? 'text-rose-600' : 'text-emerald-600'} mt-1">${deadOrOverdueBucketCount} <span class="text-xs font-normal text-slate-500">ใบ</span></p>

              <input type="text" value="${escStr(BUCKET_VIEW_STATE.searchShop)}" oninput="BUCKET_VIEW_STATE.searchShop=this.value; drawBucketsDashboard();" placeholder="🔍 ค้นหาชื่อร้าน, เบอร์ถัง..." class="w-48 px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-indigo-400 no-print">

              <input type="text" value="${escStr(BUCKET_VIEW_STATE.searchEvent)}" oninput="BUCKET_VIEW_STATE.searchEvent=this.value; drawBucketsDashboard();" placeholder="🔍 ค้นหางานนอก, เบอร์ถัง..." class="w-48 px-3 py-1.5 text-xs bg-white border border-amber-200 rounded-xl font-bold outline-none focus:border-amber-400 no-print">
            </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">

              <i data-lucide="history" class="w-4 h-4 text-blue-600"></i> 3. สมุดประวัติการยืม-คืนและโอนย้ายถังน้ำแข็งล่าสุด (${filteredLogs.length} รายการ)
            </h3>
            <input type="text" value="${escStr(BUCKET_VIEW_STATE.searchLog)}" oninput="BUCKET_VIEW_STATE.searchLog=this.value; drawBucketsDashboard();" placeholder="🔍 ค้นหาประวัติชื่อร้าน, เบอร์ถัง..." class="w-56 px-3 py-1.5 text-xs bg-white border border-slate-300 rounded-xl font-bold outline-none no-print">
          </div>
          <div class="overflow-x-auto max-h-[360px]">
            <table class="w-full text-left border-collapse">

                  <th class="py-2.5 px-3">หมายเหตุ / ผู้ทำรายการ</th>
                  <th class="py-2.5 px-2 text-center no-print">ใบยืม/คืน</th>
                </tr>

              <tbody>${logRows}</tbody>
            </table>

      </div>
    `;
    lucide.createIcons();

  // 🖨️ ฟังก์ชันพิมพ์สลิปใบยืม-คืนถังน้ำแข็ง (80mm) สำหรับให้ลูกค้า/เจ้าภาพงานเซ็นรับถัง
  function printBucketSlip80mm(logObj) {
    if (!logObj) return;
    const slipDiv = getBodySlipContainer();
    slipDiv.innerHTML = `
      <div style="width:100%; max-width:76mm; margin:0 auto; font-family:'Prompt', sans-serif; color:#000; background:#fff;">
        <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:8px; margin-bottom:8px;">
          <h2 style="margin:0; font-size:17px; font-weight:800;">โรงน้ำแข็งแม่ใจ</h2>
          <p style="margin:2px 0 0 0; font-size:11px;">โทร: 086-448-9066, 088-262-9154</p>
          <h3 style="margin:5px 0 0 0; font-size:13px; font-weight:bold;">ใบรับ-ส่งถังน้ำแข็ง (${logObj.ActionType || ''})</h3>
        </div>
        <div style="font-size:11px; line-height:1.5; margin-bottom:8px;">
          <div><b>เลขที่อ้างอิง:</b> ${logObj.LogID || '-'}</div>
          <div><b>วันเวลา:</b> ${String(logObj.LogDate || '').slice(0, 16)}</div>
          <div><b>ลูกค้า/ชื่องาน:</b> ${logObj.CustomerName || '-'}</div>
          <div><b>ประเภท:</b> ${logObj.BucketType || '-'}</div>
        </div>
        <div style="border-top:1px solid #000; border-bottom:1px solid #000; padding:6px 0; margin-bottom:8px; font-size:12px;">
          <div><b>จำนวนรวม: ${logObj.TotalQty || 0} ใบ</b></div>
          <div style="margin-top:3px;"><b>หมายเลขถัง (Serial):</b><br>${logObj.SerialNumbers || '-'}</div>
          ${logObj.Note ? `<div style="margin-top:4px; font-size:10px;"><b>หมายเหตุ:</b> ${logObj.Note}</div>` : ''}
        </div>
        <div style="margin-top:20px; text-align:center; font-size:10px;">
          <p>ลงชื่อ..........................................ผู้รับ/คืนถัง</p>
          <p style="margin-top:14px;">ลงชื่อ..........................................เจ้าหน้าที่โรงงาน</p>
        </div>
      </div>
    `;
    document.body.classList.add('print-slip');
    slipDiv.classList.remove('hidden');
    setTimeout(() => {
      window.print();
      slipDiv.classList.add('hidden');
      document.body.classList.remove('print-slip');
    }, 150);
  }
  // 🖨️ ฟังก์ชันพิมพ์ใบเช็กถังน้ำแข็งมาตรฐาน A4 (แยกตารางชัดเจน ไม่ทับซ้อนกัน 100%)
  function printBucketAuditA4Report() {
    const d = STATE.bucket || {};
    const allBuckets = d.allBuckets || [];
    const routeFilter = BUCKET_VIEW_STATE.filterRoute;
    const riskFilter = BUCKET_VIEW_STATE.filterRisk;
    const qShop = (BUCKET_VIEW_STATE.searchShop || '').toLowerCase();
    const qEvent = (BUCKET_VIEW_STATE.searchEvent || '').toLowerCase();

    const inStockList = allBuckets.filter(b => b.CurrentStatus === 'ในคลัง');
    const maintList = allBuckets.filter(b => b.CurrentStatus === 'ส่งซ่อม');
    const borrowedList = allBuckets.filter(b => b.CurrentStatus === 'ถูกยืม');

    const shopGroups = {};
    const eventGroups = {};

    borrowedList.forEach(b => {
      const holder = String(b.CurrentLocation || 'ไม่ระบุชื่อ').trim();
      const activeLoanType = b.LoanType || b.BucketType || 'ถังยืมร้าน';
      if (activeLoanType === 'ถังยืมงาน') {
        if (!eventGroups[holder]) eventGroups[holder] = [];
        eventGroups[holder].push(b);
      } else {
        if (!shopGroups[holder]) shopGroups[holder] = [];
        shopGroups[holder].push(b);
      }
    });

    // 1. สร้างแถวตารางถังค้างร้านประจำ
    let shopSeq = 0;
    let totalShopBucketsShown = 0;
    const shopRowsHTML = Object.keys(shopGroups).map(holder => {
      const list = shopGroups[holder];
      const first = list[0] || {};
      const rId = first.HolderRouteID || '';
      const rName = first.HolderRouteName || 'หน้าลาน';
      const daysSinceSale = first.DaysSinceLastSale;
      const qty30d = first.Last30DaysQty || 0;
      const isRisk = (daysSinceSale === null || daysSinceSale >= 3);

      if (routeFilter !== 'ALL' && rId !== routeFilter && rName !== routeFilter) return '';
      if (riskFilter === 'RISK_ONLY' && !isRisk) return '';
      if (qShop && !holder.toLowerCase().includes(qShop) && !list.some(b => String(b.SerialNumber).toLowerCase().includes(qShop))) return '';

      shopSeq++;
      totalShopBucketsShown += list.length;
      const serialsText = list.map(b => `<b>${b.SerialNumber}</b> (${b.Capacity})`).join(', ');

      let statusText = `ปกติ (30 วัน: ${qty30d} ถุง)`;
      let statusColor = '#047857';
      if (daysSinceSale === null) {
        statusText = '🚨 ถังจม (ไม่มีประวัติซื้อ)';
        statusColor = '#be123c';
      } else if (daysSinceSale >= 7) {
        statusText = `🚨 ถังจม (ไม่ซื้อ ${daysSinceSale} วัน!)`;
        statusColor = '#be123c';
      } else if (daysSinceSale >= 3) {
        statusText = `⚠️ ไม่ลง ${daysSinceSale} วัน (30 วัน: ${qty30d} ถุง)`;
        statusColor = '#b45309';
      }

      return `
        <tr>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center;">${shopSeq}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; font-weight: bold;">${holder}${first.HolderPhone ? `<br><span style="font-size: 9px; font-weight: normal; color: #475569;">📞 ${first.HolderPhone}</span>` : ''}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1;">${rName}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold;">${list.length} ใบ</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1;">${serialsText}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; font-weight: bold; color: ${statusColor};">${statusText}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center;">☐ ครบ &nbsp; ☐ เก็บคืน</td>
        </tr>
      `;
    }).filter(Boolean).join('');

    // 2. สร้างแถวตารางถังค้างงานนอก (อีเวนต์ / งานบุญ)
    let eventSeq = 0;
    let totalEventBucketsShown = 0;
    const eventRowsHTML = Object.keys(eventGroups).map(holder => {
      const list = eventGroups[holder];
      const first = list[0] || {};
      const maxBorrowDays = Math.max(...list.map(b => (b.BorrowDays !== undefined ? b.BorrowDays : calcDaysDiff(b.BorrowDate))));
      const isRisk = maxBorrowDays >= 3;

      if (riskFilter === 'RISK_ONLY' && !isRisk) return '';
      if (qEvent && !holder.toLowerCase().includes(qEvent) && !list.some(b => String(b.SerialNumber).toLowerCase().includes(qEvent))) return '';

      eventSeq++;
      totalEventBucketsShown += list.length;
      const serialsText = list.map(b => `<b>${b.SerialNumber}</b> (${b.Capacity})`).join(', ');

      return `
        <tr>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center;">${eventSeq}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; font-weight: bold;">${holder}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold; color: ${isRisk ? '#be123c' : '#b45309'};">${maxBorrowDays} วัน ${isRisk ? '(เกินกำหนด!)' : ''}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold;">${list.length} ใบ</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1;">${serialsText}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; font-size: 9.5px;">${first.Note || '-'}</td>
          <td style="padding: 5px; border: 1px solid #cbd5e1; text-align: center;">☐ รับคืนแล้ว</td>
        </tr>
      `;
    }).filter(Boolean).join('');

    const inStockSerialsText = inStockList.map(b => `<b>${b.SerialNumber}</b> (${b.Capacity})`).join(', ') || 'ไม่มีถังในคลัง';
    const maintSerialsText = maintList.map(b => `<b>${b.SerialNumber}</b> (${b.Capacity})`).join(', ') || '-';

    const reportHTML = `
      <div style="background: #ffffff; padding: 4mm; font-family: 'Prompt', sans-serif; color: #000000;">
        <div style="border-bottom: 2px solid #0f172a; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end;">
          <div>
            <h1 style="font-size: 16px; font-weight: 800; margin: 0;">โรงน้ำแข็งแม่ใจ — ใบตรวจเช็กถังน้ำแข็งค้างตามสายส่งและงานนอก (Bucket Audit Checklist)</h1>
            <p style="font-size: 11px; margin: 2px 0 0 0; color: #334155;">
              ขอบเขตสายส่ง: <b>${routeFilter === 'ALL' ? 'รวมทุกสายส่ง + หน้าลาน' : routeFilter}</b> |
              โหมดแสดงผล: <b>${riskFilter === 'RISK_ONLY' ? 'เฉพาะถังจม / งานนอกเกินกำหนด' : 'ทุกรายการ'}</b>
            </p>
          </div>
          <div style="text-align: right; font-size: 10px; color: #475569;">พิมพ์เมื่อ: ${new Date().toLocaleString('th-TH')}</div>
        </div>

        <!-- สรุปยอดถังรวมทั้งโรงงาน -->
        <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 12px; text-align: center;">
          <tr style="background: #f1f5f9; font-weight: bold;">
            <td style="padding: 6px; border: 1px solid #cbd5e1;">ถังทั้งหมดในระบบ<br><b style="font-size: 13px;">${allBuckets.length} ใบ</b></td>
            <td style="padding: 6px; border: 1px solid #cbd5e1; color: #047857;">พร้อมใช้ในคลัง<br><b style="font-size: 13px;">${inStockList.length} ใบ</b></td>

  function setInvQuickDate(mode) {

      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      INV_VIEW_STATE.startDate = fmt(y);
      INV_VIEW_STATE.endDate = fmt(y);
    } else if (mode === '7DAYS') {

      INV_VIEW_STATE.startDate = fmt(w);
      INV_VIEW_STATE.endDate = fmt(now);
    } else if (mode === 'MONTH') {
      INV_VIEW_STATE.startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);

  async function cancelInventoryLogById(invLogId, labelText) {
    if (!confirm(`⚠️ ยืนยันการยกเลิกรายการสต๊อก "${labelText}" (${invLogId}) ที่คีย์ผิดใช่หรือไม่?\n\nระบบจะสร้างรายการหักล้างเพื่อคืนยอดคงเหลือในห้องเย็นให้ถูกต้องอัตโนมัติค่ะ`)) return;
    try {
      await apiCall('cancelInventoryLog', { InvLogID: invLogId });
      showToast('ยกเลิกรายการสต๊อกที่คีย์ผิดเรียบร้อยแล้วค่ะ!');
      renderInventory();
    } catch (e) {}
  }
  // ==========================================
  // 👥 VIEW 7: CUSTOMERS REGISTRY & INACTIVE CUSTOMER RADAR (รายงานลูกค้าไม่ส่งเกิน 3-7 วัน)
  // ==========================================
  window.CUST_INACTIVE_FILTER = 'ALL'; // ALL, ACTIVE_0_2, WARN_3_7, OVER_3, CRIT_8_PLUS

  async function renderCustomers() { 
    try {
      const d = await apiCall('getCustomerDashboard');
      STATE.customerDashboard.list = d.customers || [];
      STATE.customerDashboard.routes = d.routes || [];
      STATE.customerDashboard.products = d.products || [];
      drawCustomerTable();
    } catch (e) {
      showToast('เกิดข้อผิดพลาดในการโหลดข้อมูลลูกค้า', 'error');
    } 
  }

  function setCustInactiveFilter(mode) {
    window.CUST_INACTIVE_FILTER = mode;
    drawCustomerTable();
  }

  function drawCustomerTable() { 
    const view = document.getElementById('app-view'); 
    const searchQuery = document.getElementById('c-search') ? document.getElementById('c-search').value.toLowerCase() : ''; 
    const filterRoute = document.getElementById('c-filter-route') ? document.getElementById('c-filter-route').value : 'all'; 
    const inactiveMode = window.CUST_INACTIVE_FILTER || 'ALL';

    const allCusts = STATE.customerDashboard.list || [];

    // คำนวณจำนวนร้านในแต่ละกลุ่มความเสี่ยง (ตามสายส่งที่เลือก)
    const routeScopedCusts = allCusts.filter(c => filterRoute === 'all' || c.RouteID === filterRoute);
    const countActive0to2 = routeScopedCusts.filter(c => c.DaysInactive !== null && c.DaysInactive <= 2).length;
    const countWarn3to7 = routeScopedCusts.filter(c => c.DaysInactive !== null && c.DaysInactive >= 3 && c.DaysInactive <= 7).length;
    const countOver7OrNever = routeScopedCusts.filter(c => c.DaysInactive === null || c.DaysInactive > 7).length;
    const countAllOver3 = countWarn3to7 + countOver7OrNever;

    const filtered = allCusts.filter(c => { 
      const matchRoute = filterRoute === 'all' || c.RouteID === filterRoute; 
      const matchSearch = String(c.CustomerName || '').toLowerCase().includes(searchQuery) || String(c.CustomerID || '').toLowerCase().includes(searchQuery) || String(c.Phone || '').toLowerCase().includes(searchQuery); 
      if (!matchRoute || !matchSearch) return false;

      const d = c.DaysInactive;
      if (inactiveMode === 'ACTIVE_0_2') return (d !== null && d <= 2);
      if (inactiveMode === 'WARN_3_7') return (d !== null && d >= 3 && d <= 7);
      if (inactiveMode === 'CRIT_8_PLUS') return (d === null || d > 7);
      if (inactiveMode === 'OVER_3') return (d === null || d >= 3);
      return true;
    });

    // หากอยู่ในโหมดดูร้านที่ขาดส่ง ให้เรียงลำดับจากร้านที่ขาดส่งนานที่สุดขึ้นก่อน
    if (inactiveMode !== 'ALL') {
      filtered.sort((a, b) => {
        const da = a.DaysInactive === null ? 9999 : a.DaysInactive;
        const db = b.DaysInactive === null ? 9999 : b.DaysInactive;
        return db - da;
      });
    }

    const rows = filtered.map(c => { 
      const isActive = c.Status === 'Active' || !c.Status || String(c.Status).trim() === ''; 
      const statusBadge = isActive
        ? `<span class="inline-flex items-center bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full text-[10px] font-bold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span> ใช้งาน</span>`
        : `<span class="inline-flex items-center bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-full text-[10px] font-bold"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span> ระงับ</span>`; 

      // ⏱️ ป้ายแสดงสถานะการส่งน้ำแข็งล่าสุด & จำนวนวันที่ไม่ได้ลงน้ำแข็ง
      const days = c.DaysInactive;
      let activityBadge = '';
      if (days === null) {
        activityBadge = `
          <span class="inline-flex items-center bg-slate-100 text-slate-600 border border-slate-300 px-2.5 py-1 rounded-lg text-xs font-extrabold">⚪ ยังไม่มีประวัติซื้อ</span>
          <p class="text-[10px] text-slate-400 mt-1">ยังไม่เคยเปิดบิลในระบบ</p>
        `;
      } else if (days === 0) {
        activityBadge = `
          <span class="inline-flex items-center bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-1 rounded-lg text-xs font-extrabold">🟢 ส่งแล้ววันนี้</span>
          <p class="text-[10px] text-slate-500 mt-1">ล่าสุด: ${c.LastSaleDate} (฿${Number(c.LastSaleAmount).toLocaleString()})</p>
        `;
      } else if (days <= 2) {
        activityBadge = `
          <span class="inline-flex items-center bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-lg text-xs font-bold">🟢 ${days} วันที่แล้ว</span>
          <p class="text-[10px] text-slate-500 mt-1">ล่าสุด: ${c.LastSaleDate} (฿${Number(c.LastSaleAmount).toLocaleString()})</p>
        `;
      } else if (days >= 3 && days <= 7) {
        activityBadge = `
          <span class="inline-flex items-center bg-amber-100 text-amber-900 border-2 border-amber-400 px-2.5 py-1 rounded-lg text-xs font-black animate-pulse">⚠️ ไม่ส่ง ${days} วัน</span>
          <p class="text-[10px] text-amber-700 font-bold mt-1">ล่าสุด: ${c.LastSaleDate} (฿${Number(c.LastSaleAmount).toLocaleString()})</p>
        `;
      } else {
        activityBadge = `
          <span class="inline-flex items-center bg-rose-100 text-rose-800 border-2 border-rose-400 px-2.5 py-1 rounded-lg text-xs font-black">🚨 ขาดส่ง ${days} วัน!</span>
          <p class="text-[10px] text-rose-600 font-bold mt-1">ล่าสุด: ${c.LastSaleDate} (฿${Number(c.LastSaleAmount).toLocaleString()})</p>
        `;

    'tb_Vehicles': { title: 'ทะเบียนรถขนส่ง', pk: 'VehicleID', fields: [{ k: 'LicensePlate', l: 'ทะเบียนรถ' }, { k: 'VehicleType', l: 'ประเภทรถ' }, { k: 'Capacity', l: 'ความจุ (กระสอบ)' }] }, 
    'tb_Employees': { title: 'ระบบพนักงาน & รหัส PIN สายส่ง/สำนักงาน', pk: 'EmpID', fields: [{ k: 'EmpName', l: 'ชื่อ-นามสกุล' }, { k: 'Phone', l: 'เบอร์โทรศัพท์' }, { k: 'Position', l: 'ตำแหน่ง (เช่น ผู้บริหาร, เสมียนหน้าลาน, คนขับรถ)' }, { k: 'PIN', l: 'รหัส PIN เข้าสู่ระบบ (4-6 หลัก)' }] },
    'tb_Promotions': { title: 'ทะเบียนโปรโมชั่น (คละ 3 ชิ้น 100 บาท)', pk: 'PromoID', fields: [{ k: 'PromoName', l: 'รหัสเงื่อนไข (เช่น 3FOR100:C-0001)' }, { k: 'DiscountAmt', l: 'รหัสสินค้าที่ร่วมรายการ (หรือ ALL)' }] }
  };

  // ตัวช่วยเทียบรหัสให้ตรงกันแม้ไม่มีขีดคั่น (เช่น C049 == C-0049, P001 == P-0001)
  function normCodeKey_(code) {
    const s = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    const m = s.match(/^([A-Z]+)(\d+)$/);
    return m ? `${m[1]}${parseInt(m[2], 10)}` : s;
  }

  async function navigateMaster(tbl) { 
    if (!window.STATE.currentUser) {
      document.getElementById('factory-login-screen')?.classList.remove('hidden');
      return;
    }
    const cleanTbl = String(tbl || '').trim();
    if (cleanTbl === 'tb_Employees' && window.STATE.currentUser.Role !== 'ADMIN') {
      return showToast('เฉพาะสิทธิ์ "ผู้บริหาร" เท่านั้นที่สามารถจัดการรหัส PIN พนักงานได้ค่ะ', 'error');
    }

    STATE.master.tableName = cleanTbl;
    setActiveNav(cleanTbl);
    const cfg = MASTER_CFG[cleanTbl];
    const view = document.getElementById('app-view');
    if (!cfg) return showToast('ไม่พบการตั้งค่าหน้าจอสำหรับ: ' + cleanTbl, 'error');

    // 🌟 หากเป็น "ทะเบียนโปรโมชั่น" หรือ "ทะเบียนราคาพิเศษ" ให้แสดงหน้าจอแบบ Smart Relational View ที่อ่านเข้าใจง่ายทันที!
    if (cleanTbl === 'tb_Promotions' || cleanTbl === 'tb_SpecialPrices') {
      try {
        const [masterList, custDash] = await Promise.all([
          apiCall('getMasterData', { tableName: cleanTbl }),
          apiCall('getCustomerDashboard')
        ]);
        STATE.master.list = masterList || [];
        STATE.customerDashboard.list = custDash.customers || [];
        STATE.customerDashboard.routes = custDash.routes || [];
        STATE.customerDashboard.products = custDash.products || [];

        if (cleanTbl === 'tb_Promotions') drawFriendlyPromotionsView();
        else drawFriendlySpecialPricesView();
      } catch (e) {}
      return;
    }

    try { 
      STATE.master.list = await apiCall('getMasterData', { tableName: cleanTbl }); 
      const cards = (STATE.master.list || []).map(i => {
        const subDetails = cfg.fields.slice(1).map(f => `${f.l}: <b class="text-slate-700">${i[f.k] || '-'}</b>`).join(' | ');
        return `<div onclick="openMasterModalById('${escStr(i[cfg.pk])}')" class="bg-white p-4 rounded-2xl border border-slate-200 cursor-pointer hover:border-blue-500 hover:shadow-md shadow-sm transition flex flex-col justify-between"><div><div class="flex justify-between items-center"><span class="text-[11px] font-mono bg-blue-50 text-blue-700 border border-blue-100 px-2 py-0.5 rounded font-bold">${i[cfg.pk]}</span><i data-lucide="edit-2" class="w-3.5 h-3.5 text-slate-400"></i></div><h4 class="font-bold mt-2.5 text-slate-800 text-base">${i[cfg.fields[0].k] || '-'}</h4></div><p class="text-xs text-slate-500 mt-3 pt-2 border-t border-slate-100">${subDetails}</p></div>`;
      }).join('') || `<div class="col-span-full text-center py-12 text-slate-400 font-medium bg-white rounded-2xl border border-dashed border-slate-200">ยังไม่มีข้อมูลในระบบ กดปุ่ม "+ เพิ่มข้อมูล" ด้านบนได้เลยค่ะ</div>`; 
      view.innerHTML = `<div class="max-w-5xl mx-auto space-y-5 pb-10"><div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-xl font-bold text-slate-800">${cfg.title}</h2><p class="text-xs text-slate-500 mt-0.5">จำนวนทั้งหมด ${(STATE.master.list || []).length} รายการ (คลิกที่การ์ดเพื่อแก้ไข)</p></div><button onclick="openMasterModalById('')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition active:scale-95">+ เพิ่มข้อมูล</button></div><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">${cards}</div></div>`; 
      lucide.createIcons();
    } catch (e) {} 
  }

  // 🎁 หน้าจอ "ทะเบียนโปรโมชั่น" รูปแบบใหม่ (แสดงชื่อร้านค้า + สายส่ง + ชื่อน้ำแข็งที่ร่วมรายการ อ่านง่าย 100%)
  function drawFriendlyPromotionsView() {
    const view = document.getElementById('app-view');
    const q = (document.getElementById('prm-search')?.value || '').toLowerCase();
    const filterRoute = document.getElementById('prm-route-filter')?.value || 'ALL';
    const filterMode = document.getElementById('prm-mode-filter')?.value || 'PROMO_ONLY';

    const customers = STATE.customerDashboard.list || [];
    const routes = STATE.customerDashboard.routes || [];
    const products = STATE.customerDashboard.products || [];

    // สร้างแผนที่ค้นหาลูกค้าและสินค้า (รองรับทั้ง C049 และ C-0049, P001 และ P-0001)
    const custLookup = {};
    customers.forEach(c => {
      custLookup[String(c.CustomerID).trim()] = c;
      custLookup[normCodeKey_(c.CustomerID)] = c;
    });

    const prodLookup = {};
    products.forEach(p => {
      prodLookup[String(p.ProductID).trim()] = p.ProductName;
      prodLookup[normCodeKey_(p.ProductID)] = p.ProductName;
    });

    // รวมข้อมูลจาก tb_Promotions เข้ากับรายชื่อร้านค้า
    const promoRows = (STATE.master.list || []).filter(r => r.Status !== 'Inactive');
    const promoByCustId = {};
    promoRows.forEach(r => {
      const rawName = String(r.PromoName || '');
      const rawCid = rawName.replace(/^3FOR100:/i, '').trim();
      const matchedCust = custLookup[rawCid] || custLookup[normCodeKey_(rawCid)];
      const key = matchedCust ? matchedCust.CustomerID : rawCid;
      promoByCustId[key] = {
        PromoID: r.PromoID,
        RawCid: rawCid,
        Customer: matchedCust || null,
        EligibleStr: String(r.DiscountAmt || 'ALL').trim()
      };
    });

    // สร้างรายการการ์ดแสดงผล
    let displayItems = [];
    if (filterMode === 'ALL_SHOPS') {
      displayItems = customers.map(c => {
        const prm = promoByCustId[c.CustomerID];
        return {
          PromoID: prm ? prm.PromoID : '',
          CustomerID: c.CustomerID,
          CustomerName: c.CustomerName,
          Phone: c.Phone || '',
          RouteID: c.RouteID || 'หน้าลาน',
          RouteName: c.RouteName || 'หน้าลาน',
          HasPromo: !!prm || !!c.HasPromo3For100,
          EligibleStr: prm ? prm.EligibleStr : (c.PromoEligibleProducts || 'ALL')
        };
      });
    } else {
      displayItems = Object.keys(promoByCustId).map(k => {
        const item = promoByCustId[k];
        const c = item.Customer;
        return {
          PromoID: item.PromoID,
          CustomerID: c ? c.CustomerID : item.RawCid,
          CustomerName: c ? c.CustomerName : `ร้านรหัส ${item.RawCid}`,
          Phone: c ? (c.Phone || '') : '',
          RouteID: c ? (c.RouteID || 'หน้าลาน') : '',
          RouteName: c ? (c.RouteName || 'หน้าลาน') : 'ไม่ระบุสายส่ง',
          HasPromo: true,
          EligibleStr: item.EligibleStr
        };
      });
    }

    const filtered = displayItems.filter(itm => {
      const matchRoute = filterRoute === 'ALL' || itm.RouteID === filterRoute || itm.RouteName === filterRoute;
      const matchQ = !q || String(itm.CustomerName).toLowerCase().includes(q) || String(itm.CustomerID).toLowerCase().includes(q) || String(itm.PromoID).toLowerCase().includes(q);
      return matchRoute && matchQ;
    });

    const routeOpts = routes.map(r => `<option value="${r.RouteID}" ${filterRoute === r.RouteID ? 'selected' : ''}>🚚 ${r.RouteName}</option>`).join('');

    const cardsHTML = filtered.map(itm => {
      // แปลงรหัส P001,P002 เป็นชื่อน้ำแข็งภาษาไทยที่อ่านง่าย
      let prodBadges = '';
      if (!itm.EligibleStr || itm.EligibleStr.toUpperCase() === 'ALL') {
        prodBadges = `<span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-bold">✅ น้ำแข็งทุกรายการ</span>`;
      } else {
        prodBadges = itm.EligibleStr.split(',').map(code => {
          const clean = code.trim();
          const pName = prodLookup[clean] || prodLookup[normCodeKey_(clean)] || clean;
          return `<span class="px-2 py-0.5 rounded-lg bg-purple-50 text-purple-800 border border-purple-200 text-[11px] font-bold">🧊 ${pName}</span>`;
        }).join(' ');
      }

      return `
        <div onclick="openCustomerModalById('${escStr(itm.CustomerID)}')" class="bg-white p-4 rounded-2xl border-2 ${itm.HasPromo ? 'border-purple-300 hover:border-purple-500' : 'border-slate-200 hover:border-blue-400'} cursor-pointer shadow-xs hover:shadow-md transition flex flex-col justify-between space-y-3">
          <div>
            <div class="flex justify-between items-start gap-2">
              <span class="px-2.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200 text-[10px] font-extrabold">🚚 ${itm.RouteName}</span>
              <span class="text-[10px] font-mono text-slate-400">${itm.PromoID || itm.CustomerID}</span>
            </div>
            <h4 class="font-extrabold text-slate-800 text-base mt-2 flex items-center justify-between">
              <span>${itm.CustomerName}</span>
              <span class="text-xs font-mono text-slate-400 font-normal">(${itm.CustomerID})</span>
            </h4>
            ${itm.Phone ? `<p class="text-[11px] text-slate-500 mt-0.5">📞 ${itm.Phone}</p>` : ''}
          </div>

          <div class="pt-2.5 border-t border-slate-100 space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="text-[11px] font-bold text-slate-500">สิทธิ์โปรโมชั่น:</span>
              ${itm.HasPromo
                ? `<span class="px-2.5 py-0.5 rounded-full bg-purple-600 text-white text-[10px] font-extrabold">🎁 เปิดโปรคละ 3 ชิ้น 100.-</span>`
                : `<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[10px] font-bold">ปิดโปรโมชั่น</span>`
              }
            </div>
            ${itm.HasPromo ? `
              <div>
                <p class="text-[10px] font-bold text-slate-400 mb-1">สินค้าที่ร่วมโปรคละได้:</p>
                <div class="flex flex-wrap gap-1">${prodBadges}</div>
              </div>
            ` : ''}
          </div>

          <div class="pt-1 flex justify-end">
            <span class="text-[11px] font-extrabold text-blue-600 flex items-center gap-1">
              <i data-lucide="sliders" class="w-3.5 h-3.5"></i> คลิกเพื่อตั้งค่าโปร/ราคาพิเศษ
            </span>
          </div>
        </div>
      `;
    }).join('') || `<div class="col-span-full bg-white py-12 rounded-2xl border border-dashed border-slate-300 text-center text-slate-400 font-bold">ไม่พบร้านค้าตามเงื่อนไขที่ค้นหา</div>`;

    view.innerHTML = `
      <div class="max-w-6xl mx-auto space-y-5 pb-10">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap justify-between items-center gap-3">
          <div>
            <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
              <i data-lucide="gift" class="w-6 h-6 text-purple-600"></i> ทะเบียนโปรโมชั่น (คละ 3 กระสอบ 100 บาท)
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">แสดงชื่อร้านค้า สายส่ง และชนิดน้ำแข็งที่ร่วมรายการอย่างชัดเจน (คลิกที่การ์ดร้านเพื่อเปิด/ปิดโปรโมชั่นได้ทันที)</p>
          </div>
          <button onclick="navigate('customers')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-xl text-xs font-extrabold shadow-sm flex items-center gap-1.5">
            <i data-lucide="user-plus" class="w-4 h-4"></i> + เปิดโปรให้ร้านค้าเพิ่ม
          </button>
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap justify-between items-center gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <select id="prm-mode-filter" onchange="drawFriendlyPromotionsView()" class="p-2.5 bg-purple-50 border border-purple-200 rounded-xl text-xs font-extrabold text-purple-900 outline-none">
              <option value="PROMO_ONLY" ${filterMode === 'PROMO_ONLY' ? 'selected' : ''}>🎁 เฉพาะร้านที่ได้รับโปร 3/100 (${Object.keys(promoByCustId).length} ร้าน)</option>
              <option value="ALL_SHOPS" ${filterMode === 'ALL_SHOPS' ? 'selected' : ''}>🏪 แสดงร้านค้าทั้งหมด (${customers.length} ร้าน)</option>
            </select>
            <select id="prm-route-filter" onchange="drawFriendlyPromotionsView()" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none">
              <option value="ALL">📍 ทุกสายส่ง</option>
              <option value="หน้าลาน" ${filterRoute === 'หน้าลาน' ? 'selected' : ''}>🏠 หน้าลาน (หน้าร้าน)</option>
              ${routeOpts}
            </select>
          </div>
          <input type="text" id="prm-search" oninput="drawFriendlyPromotionsView()" value="${escStr(q)}" placeholder="🔍 ค้นหาชื่อร้านค้า, รหัสลูกค้า..." class="w-full sm:w-64 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-purple-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${cardsHTML}</div>
      </div>
    `;
    lucide.createIcons();
    if (q) {
      const sb = document.getElementById('prm-search');
      sb.focus();
      sb.setSelectionRange(sb.value.length, sb.value.length);
    }
  }

  // 🏷️ หน้าจอ "ทะเบียนราคาพิเศษ" รูปแบบใหม่ (จัดกลุ่มตามร้านค้า แสดงชื่อร้าน + สายส่ง + เทียบราคาปกติกับราคาพิเศษชัดเจน)
  function drawFriendlySpecialPricesView() {
    const view = document.getElementById('app-view');
    const q = (document.getElementById('sp-search')?.value || '').toLowerCase();
    const filterRoute = document.getElementById('sp-route-filter')?.value || 'ALL';

    const customers = STATE.customerDashboard.list || [];
    const routes = STATE.customerDashboard.routes || [];
    const products = STATE.customerDashboard.products || [];

    const custLookup = {};
    customers.forEach(c => {
      custLookup[String(c.CustomerID).trim()] = c;
      custLookup[normCodeKey_(c.CustomerID)] = c;
    });

    const prodLookup = {};
    products.forEach(p => {
      prodLookup[String(p.ProductID).trim()] = p;
      prodLookup[normCodeKey_(p.ProductID)] = p;
    });

    // จัดกลุ่มรายการราคาพิเศษตามร้านค้า
    const groupedByShop = {};
    (STATE.master.list || []).forEach(sp => {
      if (sp.Status === 'Inactive' || sp.SpecialPrice === '') return;
      const rawCid = String(sp.CustomerID || '').trim();
      const rawPid = String(sp.ProductID || '').trim();
      const c = custLookup[rawCid] || custLookup[normCodeKey_(rawCid)];
      const p = prodLookup[rawPid] || prodLookup[normCodeKey_(rawPid)];

      const shopKey = c ? c.CustomerID : rawCid;
      if (!groupedByShop[shopKey]) {
        groupedByShop[shopKey] = {
          CustomerID: c ? c.CustomerID : rawCid,
          CustomerName: c ? c.CustomerName : `ร้านรหัส ${rawCid}`,
          Phone: c ? (c.Phone || '') : '',
          RouteID: c ? (c.RouteID || 'หน้าลาน') : '',
          RouteName: c ? (c.RouteName || 'หน้าลาน') : 'ไม่ระบุสายส่ง',
          HasPromo3For100: c ? !!c.HasPromo3For100 : false,
          Items: []
        };
      }
      groupedByShop[shopKey].Items.push({
        SpPriceID: sp.SpPriceID,
        ProductID: p ? p.ProductID : rawPid,
        ProductName: p ? p.ProductName : rawPid,
        DefaultPrice: p ? (parseFloat(p.DefaultPrice) || 0) : 0,
        Unit: p ? (p.Unit || 'หน่วย') : 'หน่วย',
        SpecialPrice: parseFloat(sp.SpecialPrice) || 0
      });
    });

    const shopList = Object.values(groupedByShop).filter(shop => {
      const matchRoute = filterRoute === 'ALL' || shop.RouteID === filterRoute || shop.RouteName === filterRoute;
      const matchQ = !q || String(shop.CustomerName).toLowerCase().includes(q) || String(shop.CustomerID).toLowerCase().includes(q);
      return matchRoute && matchQ;
    });

    const routeOpts = routes.map(r => `<option value="${r.RouteID}" ${filterRoute === r.RouteID ? 'selected' : ''}>🚚 ${r.RouteName}</option>`).join('');

    const cardsHTML = shopList.map(shop => {
      const itemRows = shop.Items.map(itm => `
        <div class="flex justify-between items-center py-1.5 px-2.5 bg-amber-50/60 border border-amber-200 rounded-xl text-xs">
          <div>
            <span class="font-bold text-slate-800">🧊 ${itm.ProductName}</span>
            ${itm.DefaultPrice > 0 ? `<span class="text-[10px] text-slate-400 line-through ml-1">ปกติ ฿${itm.DefaultPrice}</span>` : ''}
          </div>
          <span class="font-black text-sm text-amber-700">฿${itm.SpecialPrice} <span class="text-[10px] font-normal text-slate-500">/${itm.Unit}</span></span>
        </div>
      `).join('');

      return `
        <div onclick="openCustomerModalById('${escStr(shop.CustomerID)}')" class="bg-white p-4 rounded-2xl border-2 border-amber-300 hover:border-amber-500 cursor-pointer shadow-xs hover:shadow-md transition flex flex-col justify-between space-y-3">
          <div>
            <div class="flex justify-between items-start gap-2">
              <span class="px-2.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200 text-[10px] font-extrabold">🚚 ${shop.RouteName}</span>
              ${shop.HasPromo3For100 ? `<span class="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 text-[10px] font-extrabold">🎁 มีโปร 3/100</span>` : `<span class="text-[10px] font-mono text-slate-400">${shop.CustomerID}</span>`}
            </div>
            <h4 class="font-extrabold text-slate-800 text-base mt-2 flex items-center justify-between">
              <span>${shop.CustomerName}</span>
              <span class="text-xs font-mono text-slate-400 font-normal">(${shop.CustomerID})</span>
            </h4>
            ${shop.Phone ? `<p class="text-[11px] text-slate-500 mt-0.5">📞 ${shop.Phone}</p>` : ''}
          </div>

          <div class="space-y-1.5 pt-2 border-t border-slate-100">
            <p class="text-[10px] font-extrabold text-slate-500">รายการราคาพิเศษเฉพาะร้านนี้ (${shop.Items.length} รายการ):</p>
            ${itemRows}
          </div>

          <div class="pt-1 flex justify-end">
            <span class="text-[11px] font-extrabold text-blue-600 flex items-center gap-1">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> คลิกเพื่อแก้ไขราคาพิเศษ
            </span>
          </div>
        </div>
      `;
    }).join('') || `<div class="col-span-full bg-white py-12 rounded-2xl border border-dashed border-slate-300 text-center text-slate-400 font-bold">ไม่พบร้านค้าที่มีราคาพิเศษในหมวดนี้</div>`;

    view.innerHTML = `
      <div class="max-w-6xl mx-auto space-y-5 pb-10">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap justify-between items-center gap-3">
          <div>
            <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">

  function openMonthlyCustomerRankingFromRegistry() {
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
    const todayISO = now.toISOString().slice(0, 10);
    REPORT_STATE.startDate = firstDay;
    REPORT_STATE.endDate = todayISO;
    REPORT_STATE.activeTab = 'CUST_RANK';
    navigate('reports');
  }

  function setReportQuickDate(mode) {
    const now = new Date();
    const fmt = d => d.toISOString().slice(0, 10);
    if (mode === 'TODAY') {
      REPORT_STATE.startDate = fmt(now);
      REPORT_STATE.endDate = fmt(now);
    } else if (mode === 'YESTERDAY') {
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      REPORT_STATE.startDate = fmt(y);
      REPORT_STATE.endDate = fmt(y);
    } else if (mode === '7DAYS') {
      const w = new Date(now);
      w.setDate(now.getDate() - 6);
      REPORT_STATE.startDate = fmt(w);
      REPORT_STATE.endDate = fmt(now);
    } else if (mode === 'MONTH') {
      const m = new Date(now.getFullYear(), now.getMonth(), 1);
      REPORT_STATE.startDate = fmt(m);
      REPORT_STATE.endDate = fmt(now);
    }
    fetchHistoricalReportData();
  }

  function onSelectReportMonth(ymStr) {
    if (!ymStr) return;
    REPORT_STATE.selectedMonthValue = ymStr;
    const parts = ymStr.split('-');
    if (parts.length === 2) {
      const yr = parseInt(parts[0], 10);
      const mo = parseInt(parts[1], 10);
      const firstDay = `${yr}-${String(mo).padStart(2, '0')}-01`;
      const lastDateObj = new Date(yr, mo, 0);
      const lastDay = `${yr}-${String(mo).padStart(2, '0')}-${String(lastDateObj.getDate()).padStart(2, '0')}`;
      REPORT_STATE.startDate = firstDay;
      REPORT_STATE.endDate = lastDay;
      REPORT_STATE.activeTab = 'CUST_RANK';
      fetchHistoricalReportData();
    }
  }

  async function fetchHistoricalReportData() {
    const sEl = document.getElementById('rpt-start');
    const eEl = document.getElementById('rpt-end');
    const rEl = document.getElementById('rpt-route');
    if (sEl) REPORT_STATE.startDate = sEl.value;
    if (eEl) REPORT_STATE.endDate = eEl.value;
    if (rEl) REPORT_STATE.routeId = rEl.value;
    try {
      const res = await apiCall('getHistoricalReport', {
        startDate: REPORT_STATE.startDate,
        endDate: REPORT_STATE.endDate,
        routeId: REPORT_STATE.routeId
      });
      REPORT_STATE.data = res;
      drawReportsCenter();
    } catch (e) {}
  }

  window.EXPENSE_STATE = {
    startDate: new Date().toISOString().slice(0, 10),

  function ensureExpensesNavButton() {
    if (!document.getElementById('nav-expenses')) {
      const invBtn = document.getElementById('nav-inventory') || document.getElementById('nav-credit');
      if (invBtn && invBtn.parentNode) {
        const btn = document.createElement('button');

        btn.onclick = () => navigate('expenses');
